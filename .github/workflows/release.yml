name: Release

on:
  workflow_dispatch:
    inputs:
      is_snapshot:
        type: boolean
        description: "Publish as a snapshot?"
        default: true
  push:
    tags:
      - "v*"

jobs:
  pre:
    runs-on: ubuntu-latest
    outputs:
      # Assume pushes to tags are always full releases
      is_full_release: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.is_snapshot == false) }}
    steps:
      - run: "true"
  release:
    name: Release
    needs: pre
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        # v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Setup Java
        # v6
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          java-version: 25
          distribution: temurin
          cache: gradle
      - name: Setup Gradle
        # v6
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
        with:
          gradle-home-cache-excludes: "caches/leaf-loom"
      # If this isn't a snapshot release, publish a snapshot release so that they are both up-to-date.
      - name: Sync Snapshot
        if: needs.pre.outputs.is_full_release == 'true'
        run: ./gradlew checkVersion copyJson publish -S -Pleaf.loom.minimalSetup=true
        env:
          ORG_GRADLE_PROJECT_mavenUsername: ${{ secrets.MAVEN_USERNAME }}
          ORG_GRADLE_PROJECT_mavenPassword: ${{ secrets.MAVEN_PASSWORD }}
          ORG_GRADLE_PROJECT_isSnapshot: true
      - name: Release
        run: ./gradlew checkVersion copyJson publish -S -Pleaf.loom.minimalSetup=true
        env:
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.GPG_PASSPHRASE }}
          ORG_GRADLE_PROJECT_mavenUsername: ${{ secrets.MAVEN_USERNAME }}
          ORG_GRADLE_PROJECT_mavenPassword: ${{ secrets.MAVEN_PASSWORD }}
          ORG_GRADLE_PROJECT_isSnapshot: ${{ needs.pre.outputs.is_full_release != 'true' }}
      - name: Generate Changelog
        if: needs.pre.outputs.is_full_release == 'true'
        id: cliff
        # v4
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff
        with:
          config: ".cliff.toml"
          args: --latest -v
        env:
          GITHUB_REPO: ${{ github.repository }}
      - name: Create GitHub Release
        if: needs.pre.outputs.is_full_release == 'true'
        # v3
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          fail_on_unmatched_files: true
          files: |
            build/libs/!(*-SNAPSHOT|*-sources|*-javadoc)*.jar*
          body: ${{ steps.cliff.outputs.content }}
      - name: Copy installer manifest
        if: needs.pre.outputs.is_full_release == 'true'
        uses: ./.github/workflows/installerjson.yml
  copyinstallerjson:
    if: ${{ github.repository_owner == 'LeafPZ' }}
    name: Copy Installer Json
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Generate
        run: ./gradlew copyJson -Pleaf.loom.minimalSetup=true
      - name: Get Loader Version
        run: echo "LOADER_VERSION=$(./gradlew -q getLoaderVersion -Pleaf.loom.minimalSetup=true | grep -Eo '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$')" >> $GITHUB_ENV
      - name: Generate Token
        id: generate_token
        # v3.2.0
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Checkout leaf
        # v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: LeafPZ/leaf
          token: ${{ steps.generate_token.outputs.token }}
          path: leaf
      - name: Copy Installer JSON to Leaf
        shell: bash
        run: |
          destFile="${{ env.LOADER_VERSION }}.json"
          cp 'src/main/resources/leaf-installer.json' "leaf/dist/loader/${destFile}"
          cd leaf
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "dist/loader/${destFile}"
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit --message "https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
            git push origin main
          fi
